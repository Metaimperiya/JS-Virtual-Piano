<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Piano™</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      accent-color: #333;
      user-select: none;
    }

    body {
      background: linear-gradient(100deg, #1d91fc 13.57%, #5a36c0 98.38%);
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 800;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow-x: auto;
    }

    .piano-container {
      background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
      border-radius: 20px 20px 12px 12px;
      padding: 25px 20px 15px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 -4px 8px rgba(0, 0, 0, 0.3), inset 0 4px 8px rgba(255, 255, 255, 0.1);
      border: 3px solid #333;
      position: relative;
      transform: scale(0.75);
      transform-origin: center center;
    }

    .title {
      text-align: center;
      color: white;
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 20px;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 3s ease-in-out infinite;
      letter-spacing: 2px;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .controls .control-group {
      background: linear-gradient(145deg, #000, #111);
      padding: 12px 18px;
      border-radius: 14px;
      border: 2px solid #444;
      text-align: center;
    }

    .controls label {
      color: white;
      font-weight: 800;
      margin-bottom: 8px;
      display: block;
      font-size: 0.95rem;
    }

    .controls .slider-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .controls .slider {
      width: 110px;
      height: 6px;
      border-radius: 3px;
      background: #333;
      outline: none;
      cursor: pointer;
    }

    .controls .slider-value {
      color: #4ecdc4;
      font-weight: 800;
      font-size: 1rem;
    }

    .piano-keys {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 2px;
      background: #111;
      padding: 15px 12px 10px;
      border-radius: 12px;
      border: 2px solid #333;
    }

    .octave-group {
      display: flex;
      position: relative;
    }

    /* Белые клавиши */
    .white-key {
      width: 36px;
      height: 150px;
      background: linear-gradient(to bottom, #ffffff 0%, #eee 100%);
      border: 1px solid #ccc;
      border-radius: 0 0 6px 6px;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 10px;
      color: #333;
      font-size: 0.85rem;
      font-weight: 800;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      position: relative;
      z-index: 1;
    }

    .white-key:hover {
      background: #f0f0f0;
    }

    .white-key.active {
      background: #ff6b6b !important;
      color: white !important;
      transform: translateY(4px);
      box-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }

    /* Чёрные клавиши */
    .black-key {
      width: 22px;
      height: 95px;
      background: linear-gradient(to bottom, #333 0%, #000 100%);
      border: 1px solid #000;
      border-radius: 0 0 5px 5px;
      position: absolute;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
      color: #fff;
      font-weight: 800;
      font-size: 0.75rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    .black-key:hover {
      background: #222;
    }

    .black-key.active {
      background: #4ecdc4 !important;
      color: white !important;
      transform: translateY(4px);
    }
  </style>
</head>
<body>

  <div class="piano-container">
    <h1 class="title">JS Piano™</h1>

    <div class="controls">
      <div class="control-group">
        <label for="octave">Октава</label>
        <div class="slider-container">
          <input class="slider" id="octave" type="range" min="-2" max="2" value="0">
          <span class="slider-value" id="octave-value">0</span>
        </div>
      </div>

      <div class="control-group">
        <label for="keyshift">Тональность</label>
        <div class="slider-container">
          <input class="slider" id="keyshift" type="range" min="-12" max="12" value="0">
          <span class="slider-value" id="keyshift-value">0</span>
        </div>
      </div>
    </div>

    <div class="piano-keys" id="piano"></div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const activeNotes = new Map();

    // КАЖДАЯ КЛАВИША НА ПИАНИНО ИМЕЕТ СВОЮ УНИКАЛЬНУЮ КНОПКУ!
    const octaveLayouts = [
      // Октава 1 (Низкая)
      [
        { note: "C", type: "white", key: "Z" },
        { note: "C#", type: "black", key: "S", offset: 25 },
        { note: "D", type: "white", key: "X" },
        { note: "D#", type: "black", key: "D", offset: 61 },
        { note: "E", type: "white", key: "C" },
        { note: "F", type: "white", key: "V" },
        { note: "F#", type: "black", key: "G", offset: 133 },
        { note: "G", type: "white", key: "B" },
        { note: "G#", type: "black", key: "H", offset: 169 },
        { note: "A", type: "white", key: "N" },
        { note: "A#", type: "black", key: "J", offset: 205 },
        { note: "B", type: "white", key: "M" }
      ],
      // Октава 2 (Средняя)
      [
        { note: "C", type: "white", key: "Q" },
        { note: "C#", type: "black", key: "2", offset: 25 },
        { note: "D", type: "white", key: "W" },
        { note: "D#", type: "black", key: "3", offset: 61 },
        { note: "E", type: "white", key: "E" },
        { note: "F", type: "white", key: "R" },
        { note: "F#", type: "black", key: "5", offset: 133 },
        { note: "G", type: "white", key: "T" },
        { note: "G#", type: "black", key: "6", offset: 169 },
        { note: "A", type: "white", key: "Y" },
        { note: "A#", type: "black", key: "7", offset: 205 },
        { note: "B", type: "white", key: "U" }
      ],
      // Октава 3 (Высокая)
      [
        { note: "C", type: "white", key: "I" },
        { note: "C#", type: "black", key: "9", offset: 25 },
        { note: "D", type: "white", key: "O" },
        { note: "D#", type: "black", key: "0", offset: 61 },
        { note: "E", type: "white", key: "P" },
        { note: "F", type: "white", key: "A" },
        { note: "F#", type: "black", key: "=", offset: 133 },
        { note: "G", type: "white", key: "F" },
        { note: "G#", type: "black", key: "1", offset: 169 },
        { note: "A", type: "white", key: "K" },
        { note: "A#", type: "black", key: "8", offset: 205 },
        { note: "B", type: "white", key: "L" }
      ]
    ];

    // Маппинг ENG + RU раскладок для каждой ноты (36 уникальных кнопок)
    const keyToNoteMap = {
      // 1 октава
      'z': 0, 'я': 0,
      's': 1, 'ы': 1,
      'x': 2, 'ч': 2,
      'd': 3, 'в': 3,
      'c': 4, 'с': 4,
      'v': 5, 'м': 5,
      'g': 6, 'п': 6,
      'b': 7, 'и': 7,
      'h': 8, 'р': 8,
      'n': 9, 'т': 9,
      'j': 10, 'о': 10,
      'm': 11, 'ь': 11,

      // 2 октава
      'q': 12, 'й': 12,
      '2': 13,
      'w': 14, 'ц': 14,
      '3': 15,
      'e': 16, 'у': 16,
      'r': 17, 'к': 17,
      '5': 18,
      't': 19, 'е': 19,
      '6': 20,
      'y': 21, 'н': 21,
      '7': 22,
      'u': 23, 'г': 23,

      // 3 октава
      'i': 24, 'ш': 24,
      '9': 25,
      'o': 26, 'щ': 26,
      '0': 27,
      'p': 28, 'з': 28,
      'a': 29, 'ф': 29,
      '=': 30,
      'f': 31, 'а': 31,
      '1': 32,
      'k': 33, 'л': 33,
      '8': 34,
      'l': 35, 'д': 35
    };

    function init() {
      createPiano();
      setupEventListeners();
    }

    function createPiano() {
      const piano = document.getElementById("piano");

      octaveLayouts.forEach((octave, octIdx) => {
        const octaveGroup = document.createElement("div");
        octaveGroup.className = "octave-group";

        // Рендерим белые клавиши
        octave.forEach((keyData, keyIdx) => {
          if (keyData.type === "white") {
            const noteIndex = octIdx * 12 + keyIdx;
            const key = document.createElement("div");
            key.className = "white-key";
            key.id = `key-${noteIndex}`;
            key.innerHTML = keyData.key;
            key.dataset.note = noteIndex;

            addMouseListeners(key, noteIndex);
            octaveGroup.appendChild(key);
          }
        });

        // Рендерим чёрные клавиши поверх
        octave.forEach((keyData, keyIdx) => {
          if (keyData.type === "black") {
            const noteIndex = octIdx * 12 + keyIdx;
            const key = document.createElement("div");
            key.className = "black-key";
            key.id = `key-${noteIndex}`;
            key.innerHTML = keyData.key;
            key.dataset.note = noteIndex;
            key.style.left = `${keyData.offset}px`;

            addMouseListeners(key, noteIndex);
            octaveGroup.appendChild(key);
          }
        });

        piano.appendChild(octaveGroup);
      });
    }

    function addMouseListeners(element, noteIndex) {
      element.addEventListener("mousedown", (e) => {
        e.preventDefault();
        playNote(noteIndex);
      });
      element.addEventListener("mouseup", () => stopNote(noteIndex));
      element.addEventListener("mouseleave", () => stopNote(noteIndex));
    }

    function playNote(noteIndex) {
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }

      if (activeNotes.has(noteIndex)) return;

      const keyEl = document.getElementById(`key-${noteIndex}`);
      if (keyEl) keyEl.classList.add("active");

      const octaveShift = parseFloat(document.getElementById("octave").value);
      const keyShift = parseFloat(document.getElementById("keyshift").value);
      
      const freq = 130.81 * Math.pow(2, (noteIndex) / 12 + octaveShift + keyShift / 12);

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.05);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      activeNotes.set(noteIndex, { osc, gain });
    }

    function stopNote(noteIndex) {
      if (!activeNotes.has(noteIndex)) return;

      const keyEl = document.getElementById(`key-${noteIndex}`);
      if (keyEl) keyEl.classList.remove("active");

      const { osc, gain } = activeNotes.get(noteIndex);
      gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      
      setTimeout(() => {
        osc.stop();
        osc.disconnect();
      }, 150);

      activeNotes.delete(noteIndex);
    }

    function setupEventListeners() {
      document.getElementById("octave").addEventListener("input", (e) => {
        document.getElementById("octave-value").textContent = e.target.value;
      });
      document.getElementById("keyshift").addEventListener("input", (e) => {
        document.getElementById("keyshift-value").textContent = e.target.value;
      });

      window.addEventListener("keydown", (e) => {
        if (e.repeat) return;
        const key = e.key.toLowerCase();
        if (keyToNoteMap[key] !== undefined) {
          playNote(keyToNoteMap[key]);
        }
      });

      window.addEventListener("keyup", (e) => {
        const key = e.key.toLowerCase();
        if (keyToNoteMap[key] !== undefined) {
          stopNote(keyToNoteMap[key]);
        }
      });
    }

    window.addEventListener("load", init);
  </script>
</body>
</html>
